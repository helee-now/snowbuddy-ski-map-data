# Examples for `planetiler verify ski-overlay.yml` (build-pack.sh runs it before every build).
# Inputs carry the sb:* tags that normalize_osm.py and orient.py write.
examples:
  - name: groomed blue trunk run that runs downhill as drawn
    input:
      source: osm
      geometry: line
      tags:
        sb:layer: piste
        sb:type: downhill
        sb:difficulty: intermediate
        sb:name: Example Run
        sb:rank: '1'
        sb:oriented: 'yes'
    output:
      layer: piste
      geometry: line
      min_zoom: 11
      tags:
        type: downhill
        difficulty: intermediate
        name: Example Run
        rank: 1
        oriented: true
        ungroomed: null
        out_of_bounds: null
        park: null

  - name: minor run too flat for a direction (no arrows)
    input:
      source: osm
      geometry: line
      tags:
        sb:layer: piste
        sb:type: downhill
        sb:difficulty: easy
        sb:rank: '3'
    output:
      layer: piste
      geometry: line
      min_zoom: 11
      tags:
        type: downhill
        difficulty: easy
        rank: 3
        oriented: null
        name: null

  - name: out-of-bounds backcountry line keeps its flags
    input:
      source: osm
      geometry: line
      tags:
        sb:layer: piste
        sb:type: downhill
        sb:difficulty: advanced
        sb:ungroomed: 'yes'
        sb:out_of_bounds: 'yes'
        sb:name: Example Bowl
    output:
      layer: piste
      geometry: line
      min_zoom: 11
      tags:
        difficulty: advanced
        ungroomed: true
        out_of_bounds: true
        name: Example Bowl

  - name: park area (run areas carry no rank or direction)
    input:
      source: osm
      geometry: polygon
      tags:
        sb:layer: piste_area
        sb:type: snow_park
        sb:difficulty: unknown
        sb:park: 'yes'
        sb:rank: '2'
        sb:oriented: 'yes'
    output:
      layer: piste_area
      geometry: polygon
      min_zoom: 11
      tags:
        type: snow_park
        difficulty: unknown
        park: true
        rank: null
        oriented: null

  - name: chair lift with occupancy, running uphill as drawn
    input:
      source: osm
      geometry: line
      tags:
        sb:layer: lift
        sb:kind: chair_lift
        sb:name: Example Express
        sb:ref: '7'
        sb:occupancy: '6'
        sb:oriented: 'yes'
    output:
      layer: lift
      geometry: line
      min_zoom: 10
      tags:
        kind: chair_lift
        name: Example Express
        ref: '7'
        occupancy: 6
        oriented: true

  - name: station point
    input:
      source: osm
      geometry: point
      tags:
        sb:layer: lift_station
        sb:name: Example Station
    output:
      layer: lift_station
      geometry: point
      min_zoom: 13
      tags:
        name: Example Station

  - name: ski area outline
    input:
      source: osm
      geometry: polygon
      tags:
        sb:layer: ski_area
        sb:name: Example Resort
    output:
      layer: ski_area
      geometry: polygon
      min_zoom: 9
      tags:
        name: Example Resort

  - name: index contour
    input:
      source: contours
      geometry: line
      tags:
        ele: 1800
    output:
      layer: contour
      geometry: line
      min_zoom: 11
      tags:
        ele: 1800
        idx: true

  - name: 20 m contour
    input:
      source: contours
      geometry: line
      tags:
        ele: 1820
    output:
      layer: contour
      geometry: line
      min_zoom: 14
      tags:
        ele: 1820
        idx: null

  - name: raw OSM tags are ignored (normalize_osm.py decides what is drawn)
    input:
      source: osm
      geometry: line
      tags:
        piste:type: downhill
        piste:difficulty: easy
    output: []
